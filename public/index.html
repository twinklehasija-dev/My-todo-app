<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, simple, and distraction-free To-Do application.">
  <title>TaskFlow — Simple To-Do App</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z'/></svg>">
</head>
<body class="theme-dark">
  <div class="app-container">
    
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h1 class="brand-title">TaskFlow</h1>
      </div>

      <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle theme" title="Toggle dark/light mode">
        <svg id="theme-icon-sun" class="theme-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="theme-icon-moon" class="theme-icon hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <main class="main-content">
      
      <section class="progress-card">
        <div class="progress-info">
          <span class="progress-label" id="progress-text">0 of 0 completed</span>
          <span class="progress-pct" id="progress-pct">0%</span>
        </div>
        <div class="progress-track">
          <div id="progress-bar-fill" class="progress-fill" style="width: 0%;"></div>
        </div>
      </section>

      <section class="add-task-card">
        <form id="todo-form" class="add-task-form" autocomplete="off">
          <div class="input-row">
            <input 
              type="text" 
              id="todo-input" 
              class="task-input" 
              placeholder="What needs to be done?" 
              required
              maxlength="200"
            />
            <button type="submit" id="btn-add-task" class="btn-add">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add</span>
            </button>
          </div>

          <div class="options-row">
            <div class="option-item">
              <label for="todo-priority" class="option-label">Priority</label>
              <select id="todo-priority" class="option-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div class="option-item">
              <label for="todo-category" class="option-label">Category</label>
              <select id="todo-category" class="option-select">
                <option value="Work" selected>Work</option>
                <option value="Personal">Personal</option>
                <option value="Shopping">Shopping</option>
                <option value="Health">Health</option>
              </select>
            </div>

            <div class="option-item">
              <label for="todo-duedate" class="option-label">Due Date</label>
              <input type="date" id="todo-duedate" class="option-date" />
            </div>
          </div>
        </form>
      </section>

      <section class="filter-bar">
        <div class="filter-tabs" role="tablist">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="active">Active</button>
          <button class="filter-tab" data-filter="completed">Completed</button>
        </div>

        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="Search..." 
            autocomplete="off"
          />
          <button id="btn-clear-search" class="btn-clear-search hidden" title="Clear">×</button>
        </div>
      </section>

      <section class="task-list-section">
        <ul id="todo-list" class="todo-list"></ul>

        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <h3 class="empty-title">All tasks completed</h3>
          <p class="empty-desc" id="empty-desc">Your to-do list is clear.</p>
        </div>
      </section>

      <footer class="app-footer">
        <span id="footer-count" class="footer-count">0 tasks left</span>
        <button id="btn-clear-completed" class="btn-clear-completed">Clear completed</button>
      </footer>

    </main>

    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
