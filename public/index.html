<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, modern, and minimalist To-Do application built with standard GET and POST REST API methods.">
  <title>TaskFlow — Clean & Simple To-Do App (GET & POST API)</title>
  
  <!-- Modern Typography (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z'/></svg>">
</head>
<body class="theme-dark">
  <div class="app-layout">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">TaskFlow</h1>
          <p class="brand-subtitle">Distraction-free tasks synced with GET & POST API</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Live API Status Indicator -->
        <button id="btn-toggle-api-drawer" class="badge-api-status" title="Click to view live GET & POST API logs">
          <span class="pulse-dot"></span>
          <span id="api-status-text">API: Ready (GET/POST)</span>
          <svg class="chevron-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- Dark/Light Theme Toggle -->
        <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle dark/light theme" title="Toggle Theme">
          <svg id="theme-icon-sun" class="theme-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="theme-icon-moon" class="theme-icon hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">
      
      <!-- Progress & Metric Overview -->
      <section class="metrics-card">
        <div class="metrics-header">
          <div class="metrics-info">
            <span class="metrics-label">Progress</span>
            <h2 id="progress-text" class="metrics-headline">0% Completed</h2>
          </div>
          <div class="metrics-counts">
            <div class="count-pill">
              <span class="count-num" id="stat-total">0</span>
              <span class="count-desc">Total</span>
            </div>
            <div class="count-pill active-pill">
              <span class="count-num" id="stat-active">0</span>
              <span class="count-desc">Active</span>
            </div>
            <div class="count-pill done-pill">
              <span class="count-num" id="stat-completed">0</span>
              <span class="count-desc">Done</span>
            </div>
          </div>
        </div>
        <div class="progress-bar-track">
          <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </section>

      <!-- Task Creator Box (Pushes via POST API) -->
      <section class="creator-card">
        <form id="todo-form" class="creator-form" autocomplete="off">
          <div class="input-primary-group">
            <input 
              type="text" 
              id="todo-input" 
              class="primary-text-input" 
              placeholder="Add a new task... (e.g. Push API updates)" 
              required
              maxlength="200"
            />
            <button type="submit" id="btn-push-task" class="btn-push">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Push Task (POST)</span>
            </button>
          </div>

          <!-- Metadata Pickers (Priority, Category, Due Date) -->
          <div class="creator-meta-row">
            <!-- Priority Selector -->
            <div class="meta-field">
              <label for="todo-priority" class="meta-label">Priority</label>
              <select id="todo-priority" class="meta-select">
                <option value="low">🟢 Low</option>
                <option value="medium" selected>🟡 Medium</option>
                <option value="high">🔴 High</option>
              </select>
            </div>

            <!-- Category Selector -->
            <div class="meta-field">
              <label for="todo-category" class="meta-label">Category</label>
              <select id="todo-category" class="meta-select">
                <option value="Work" selected>💼 Work</option>
                <option value="Personal">🏡 Personal</option>
                <option value="API">⚡ API</option>
                <option value="Study">📚 Study</option>
                <option value="Health">🧘 Health</option>
              </select>
            </div>

            <!-- Due Date Picker -->
            <div class="meta-field">
              <label for="todo-duedate" class="meta-label">Due Date</label>
              <input type="date" id="todo-duedate" class="meta-date" />
            </div>
          </div>
        </form>
      </section>

      <!-- Filtering, Search & View Controls -->
      <section class="controls-bar">
        <!-- Status Tabs -->
        <div class="filter-tabs" role="tablist">
          <button class="filter-tab active" data-filter="all" id="tab-filter-all">All</button>
          <button class="filter-tab" data-filter="active" id="tab-filter-active">Active</button>
          <button class="filter-tab" data-filter="completed" id="tab-filter-completed">Completed</button>
        </div>

        <div class="filter-secondary-group">
          <!-- Search Input -->
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              id="search-input" 
              class="search-input" 
              placeholder="Search tasks..." 
              autocomplete="off"
            />
            <button id="btn-clear-search" class="clear-search-btn hidden" title="Clear search">×</button>
          </div>

          <!-- Category Filter -->
          <select id="filter-category-select" class="secondary-select" title="Filter by category">
            <option value="all">All Categories</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="API">API</option>
            <option value="Study">Study</option>
            <option value="Health">Health</option>
          </select>

          <!-- Refresh GET Button -->
          <button id="btn-refresh-get" class="icon-btn-secondary" title="Re-fetch tasks via GET API" aria-label="Fetch latest tasks">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span class="btn-text-sm">GET</span>
          </button>
        </div>
      </section>

      <!-- Task Items List -->
      <section class="task-list-section">
        <ul id="todo-list" class="todo-list" aria-live="polite">
          <!-- Populated dynamically via GET API -->
        </ul>

        <!-- Empty State View -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon-wrap">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <h3 class="empty-title">No tasks found</h3>
          <p class="empty-desc" id="empty-desc">Your task list is clear. Use the input above to push a new task via the POST API!</p>
        </div>
      </section>

      <!-- List Footer Actions -->
      <footer class="list-footer">
        <span id="footer-count" class="footer-count-text">Loading tasks...</span>
        <div class="footer-actions">
          <button id="btn-clear-completed" class="btn-text-action" title="Clear all completed tasks via API">
            Clear Completed
          </button>
        </div>
      </footer>

    </main>

    <!-- Slide-out / Collapsible Live API Drawer -->
    <aside id="api-drawer" class="api-drawer">
      <div class="api-drawer-header">
        <div class="api-drawer-title-group">
          <span class="method-tag tag-api">REST</span>
          <h3 class="api-drawer-title">Live API Activity Log</h3>
          <span class="api-drawer-subtitle">(Inspecting GET & POST requests)</span>
        </div>
        <div class="api-drawer-actions">
          <button id="btn-clear-logs" class="btn-clear-logs" title="Clear API logs">Clear</button>
          <button id="btn-close-drawer" class="icon-btn-close" aria-label="Close API drawer">×</button>
        </div>
      </div>
      <div id="api-logs-container" class="api-logs-container">
        <!-- Populated dynamically with GET and POST network calls -->
      </div>
    </aside>

    <!-- Toast Notification Overlay -->
    <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
